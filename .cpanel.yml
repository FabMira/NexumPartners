---
deployment:
  tasks:
    - export BRANCH=$(/usr/bin/git rev-parse --abbrev-ref HEAD)
    - |
      if [ "$BRANCH" = "main" ]; then
        export DEPLOYPATH=/home2/betsabyc/public_html
      else
        export DEPLOYPATH=/home2/betsabyc/public_html_dev
      fi
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp areas-practica.html $DEPLOYPATH
    - /bin/cp contacto.html $DEPLOYPATH
    - /bin/cp nosotros.html $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.xml $DEPLOYPATH
    - /bin/cp site.webmanifest $DEPLOYPATH
    - /bin/cp -r assets $DEPLOYPATH
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/chmod 644 $DEPLOYPATH/*.html
    - /bin/chmod 644 $DEPLOYPATH/assets/css/*.css
    - /bin/chmod 644 $DEPLOYPATH/assets/js/config.js
    - /bin/chmod 644 $DEPLOYPATH/assets/img/* 2>/dev/null || true
