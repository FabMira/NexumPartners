<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">
    <title>Próximamente — Nexum Partners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f5f5f5;
            color: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            margin-bottom: 3rem;
            opacity: 0.95;
        }

        .divider {
            width: 48px;
            height: 1px;
            background-color: #c9a961;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        p {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.6;
            color: #555;
            max-width: 360px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/img/logo-header.png" alt="Nexum Partners" class="logo">
        <div class="divider"></div>
        <h1>Próximamente</h1>
    </div>
</body>
</html>
